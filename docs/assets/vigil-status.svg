<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Vigil status terminal preview</title>
  <desc id="desc">A crisp terminal-style preview of vigil status output showing service, activity, and power sections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.5" stop-color="#101820"/>
      <stop offset="1" stop-color="#15120d"/>
    </linearGradient>
    <linearGradient id="bar" x1="78" y1="80" x2="1322" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202b38"/>
      <stop offset="1" stop-color="#171b21"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#020408" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #7f8b9c; }
      .text { fill: #dce5ee; }
      .cyan { fill: #55d9ff; }
      .amber { fill: #ffc46b; }
      .green { fill: #77e2a8; }
      .line { stroke: #263341; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="0" fill="url(#bg)"/>
  <circle cx="1088" cy="608" r="240" fill="#1faad6" opacity="0.08"/>
  <circle cx="220" cy="170" r="180" fill="#f6a84d" opacity="0.07"/>

  <g filter="url(#shadow)">
    <rect x="78" y="70" width="1244" height="620" rx="18" fill="#0b1118" stroke="#263342"/>
    <path d="M96 70h1208c10 0 18 8 18 18v54H78V88c0-10 8-18 18-18Z" fill="url(#bar)"/>
    <circle cx="116" cy="106" r="9" fill="#ff6b65"/>
    <circle cx="146" cy="106" r="9" fill="#ffc457"/>
    <circle cx="176" cy="106" r="9" fill="#6de08f"/>
    <text x="700" y="113" class="sans" text-anchor="middle" font-size="18" fill="#9aa8b8">vigil status</text>

    <g class="mono" font-size="24">
      <text x="126" y="190" class="cyan">$ vigil status</text>
      <text x="126" y="238" class="text">vigil status</text>

      <text x="158" y="300" class="amber">service</text>
      <text x="194" y="340" class="muted">launchd:</text>
      <text x="390" y="340" class="green">yes</text>
      <text x="194" y="376" class="muted">daemon pid:</text>
      <text x="390" y="376" class="text">84217</text>
      <text x="194" y="412" class="muted">scan:</text>
      <text x="390" y="412" class="green">2s ago</text>
      <text x="194" y="448" class="muted">root helper:</text>
      <text x="390" y="448" class="green">loaded</text>

      <text x="690" y="300" class="amber">activity</text>
      <text x="726" y="340" class="muted">refcount:</text>
      <text x="922" y="340" class="green">1 active / 1 total</text>
      <text x="726" y="376" class="muted">agents:</text>
      <text x="922" y="376" class="text">claude=active</text>
      <text x="922" y="412" class="text">codex=idle</text>
      <text x="922" y="448" class="text">copilot=none</text>

      <line x1="126" y1="490" x2="1274" y2="490" class="line"/>

      <text x="158" y="548" class="amber">power</text>
      <text x="194" y="588" class="muted">hold:</text>
      <text x="390" y="588" class="green">engaged</text>
      <text x="564" y="588" class="muted">mode:</text>
      <text x="650" y="588" class="text">best-effort</text>
      <text x="858" y="588" class="muted">caffeinate:</text>
      <text x="1048" y="588" class="green">yes</text>
      <text x="194" y="624" class="muted">thermal:</text>
      <text x="390" y="624" class="green">ok</text>
      <text x="564" y="624" class="muted">battery:</text>
      <text x="690" y="624" class="text">AC 90%</text>
      <text x="858" y="624" class="muted">assertions:</text>
      <text x="1048" y="624" class="text">1 active</text>
    </g>
  </g>
</svg>
