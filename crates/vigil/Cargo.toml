[package]
name = "vigil"
version = "0.1.0-dev"
edition = "2024"

[[bin]]
name = "vigil"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
colorchoice-clap = "1.0.8"
comfy-table = "7.2.2"
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
